name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (xcodegen, p7zip)
        run: |
          brew install xcodegen p7zip

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/ci-build.sh
          bash scripts/ci-build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RenPyBox-IPA
          path: build/dist/RenPyBox.ipa
          if-no-files-found: error