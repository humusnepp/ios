# XcodeGen spec for RenPy Box.
# Lives at ios/project.yml in the repo; ci-build.sh generates the project from
# build/xcode/project.yml (paths are relative to that staging directory).
name: RenPyBox
options:
  bundleIdPrefix: com.renpybox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  RenPyBox:
    build:
      targets:
        RenPyBox: all
    run:
      config: Release

targets:
  RenPyBox:
    type: application
    platform: iOS

    sources:
      - path: RenPyBox
      - path: main.m
      - path: RPBAppDelegate.m
      - path: engine/Log.m
      - path: engine/IAPHelper.m
      - path: engine/VideoPlayer.m
      - path: engine/Launch Screen.storyboard
      - path: engine/LaunchImage-background.png
      - path: engine/LaunchImage-foreground.png
      - path: engine/Media.xcassets
      - path: base
        type: folder
      - path: TestGame
        type: folder

    info:
      path: Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        PRODUCT_NAME: RenPyBox
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/prebuilt/release"
        OTHER_LDFLAGS:
          - "-lrenpython"
          - "-lrenpy"
          - "-lpython3.12"
          - "-lassimp"
          - "-lavformat"
          - "-lavcodec"
          - "-lswscale"
          - "-lswresample"
          - "-lavutil"
          - "-lSDL2_image"
          - "-lSDL2"
          - "-lavif"
          - "-laom"
          - "-lyuv"
          - "-lturbojpeg"
          - "-lpng16"
          - "-lwebp"
          - "-lharfbuzz"
          - "-lbrotlidec"
          - "-lbrotlicommon"
          - "-lfribidi"
          - "-lfreetype"
          - "-lffi"
          - "-lssl"
          - "-lcrypto"
          - "-llzma"
          - "-lbz2"
          - "-lz"
          - "-lstdc++"

    dependencies:
      - framework: Frameworks/MetalANGLE.xcframework
        embed: true
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: AudioToolbox.framework
      - sdk: QuartzCore.framework
      - sdk: ImageIO.framework
      - sdk: CoreMotion.framework
      - sdk: CoreServices.framework
      - sdk: GameController.framework